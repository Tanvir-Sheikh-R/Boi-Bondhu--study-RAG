services:
  # ========================================================
  # 1. API Backend (FastAPI + RAG + multilingual-e5-base)
  # ========================================================
  backend:
    image: tanvirsheikh/study-rag-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tanvirsheikh_study-rag-backend-V4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      # Browsers omit the default HTTP port from Origin, so a UI published on port 80 is
      # reached as http://<host> — the bare host must be listed, not just http://<host>:80.
      # Both the domain and the raw IP are allowed, so the app works whichever way it is
      # opened. A blocked origin surfaces in the browser as a bare "Failed to fetch".
      - CORS_ORIGINS=http://${PUBLIC_HOST:-16.192.163.122},http://${PUBLIC_HOST:-16.192.163.122}:80,http://${PUBLIC_DOMAIN:-boi-bondhu.duckdns.org},http://${PUBLIC_DOMAIN:-boi-bondhu.duckdns.org}:80,http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    env_file:
      - path: .env
        required: false
    volumes:
      # Persistent conversation threads
      - ./backend/data:/app/backend/data
      # Dataset index & precomputed vector embeddings
      - ./chapters.json:/app/chapters.json:ro
      - ./embedding_cache:/app/embedding_cache:ro
      - ./ocr_cache:/app/ocr_cache:ro
      # Model is baked directly into the Docker image. 
      # (Do NOT mount an empty host folder on AWS or it will overwrite the baked model)
      # - ./model_cache:/app/model_cache
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - study-rag-network

  # ========================================================
  # 2. Web UI (Next.js 16 + TailwindCSS)
  # ========================================================
  web:
    image: tanvirsheikh/study-rag-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tanvirsheikh_study_rag_web_V3
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # No NEXT_PUBLIC_API_BASE here on purpose: the browser bundle derives the API
      # host from its own location at runtime (see web/src/lib/api.ts), so changing
      # PUBLIC_HOST no longer requires rebuilding this image.
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - study-rag-network

networks:
  study-rag-network:
    name: study-rag-network
    driver: bridge
