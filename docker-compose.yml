services:
  # ========================================================
  # 1. API Backend (FastAPI + RAG + multilingual-e5-base)
  # ========================================================
  backend:
    image: tanvirsheikh/study-rag-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tanvirsheikh_study-rag-backend-V4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      # Browsers omit the default HTTP/HTTPS ports (80/443) from Origin.
      # Both domain and raw IP with https and http are allowed.
      - CORS_ORIGINS=https://${PUBLIC_DOMAIN:-boi-bondhu.duckdns.org},http://${PUBLIC_DOMAIN:-boi-bondhu.duckdns.org},https://${PUBLIC_HOST:-16.192.163.122},http://${PUBLIC_HOST:-16.192.163.122},http://${PUBLIC_HOST:-16.192.163.122}:80,http://${PUBLIC_DOMAIN:-boi-bondhu.duckdns.org}:80,http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    env_file:
      - path: .env
        required: false
    volumes:
      # Persistent conversation threads
      - ./backend/data:/app/backend/data
      # Dataset index & precomputed vector embeddings
      - ./chapters.json:/app/chapters.json:ro
      - ./embedding_cache:/app/embedding_cache:ro
      - ./ocr_cache:/app/ocr_cache:ro
      # Model is baked directly into the Docker image. 
      # (Do NOT mount an empty host folder on AWS or it will overwrite the baked model)
      # - ./model_cache:/app/model_cache
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - study-rag-network

  # ========================================================
  # 2. Web UI (Next.js 16 + TailwindCSS)
  # ========================================================
  web:
    image: tanvirsheikh/study-rag-web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tanvirsheikh_study_rag_web_V3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # No NEXT_PUBLIC_API_BASE here on purpose: the browser bundle derives the API
      # host from its own location at runtime (see web/src/lib/api.ts).
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - study-rag-network

  # ========================================================
  # 3. Caddy Reverse Proxy (Automatic HTTPS via Let's Encrypt)
  # ========================================================
  caddy:
    image: tanvirsheikh/study-rag-caddy:latest
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: tanvirsheikh_study-rag-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-boi-bondhu.duckdns.org}
      - PUBLIC_HOST=${PUBLIC_HOST:-16.192.163.122}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - study-rag-network

volumes:
  # Persist Let's Encrypt SSL certificates & keys across container redeployments
  caddy_data:
  caddy_config:

networks:
  study-rag-network:
    name: study-rag-network
    driver: bridge
